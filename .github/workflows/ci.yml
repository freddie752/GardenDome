name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pre-commit

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on changed files
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SKIP: pytest,no-commit-to-branch
        run: |
          base="${PR_BASE_SHA:-$(git merge-base origin/main HEAD)}"
          pre-commit run --show-diff-on-failure --from-ref "$base" --to-ref HEAD

  test:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt -e .

      - run: pytest --cov --cov-report=term --cov-report=json

      - name: Report coverage
        id: coverage
        run: |
          percent=$(python -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered'], 2))")
          echo "percent=$percent" >> "$GITHUB_OUTPUT"
          echo "### Coverage: ${percent}%" >> "$GITHUB_STEP_SUMMARY"

  coverage-gate:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt -e .

      - run: pytest --cov --cov-report=json

      - name: Compare coverage with base
        env:
          PR_COVERAGE: ${{ needs.test.outputs.coverage }}
        run: |
          base=$(python -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered'], 2))")
          echo "### Coverage: ${PR_COVERAGE}% (base: ${base}%)" >> "$GITHUB_STEP_SUMMARY"
          if awk -v pr="$PR_COVERAGE" -v base="$base" 'BEGIN { exit !(pr < base) }'; then
            echo "::error::Coverage dropped from ${base}% to ${PR_COVERAGE}%"
            exit 1
          fi
