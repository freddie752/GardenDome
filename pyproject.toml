[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "GardenDome"
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["src/gardendome"]
omit = ["src/gardendome/vendor/*", "src/gardendome/config.py"]

[tool.coverage.report]
skip_empty = true
